name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Check structure
      run: |
        echo "=== Repository structure ==="
        pwd
        ls -la
        echo "=== Android directory ==="
        ls -la src/android/
        echo "=== Gradle wrapper ==="
        ls -la src/android/gradlew
        echo "=== Build files ==="
        find src/android -name "build.gradle*" -type f
        echo "=== Settings file ==="
        cat src/android/settings.gradle.kts | head -20
    
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build APK
      working-directory: src/android
      run: |
        echo "Building in src/android directory..."
        chmod +x ./gradlew
        ./gradlew assembleDebug --info 2>&1 | tail -100
