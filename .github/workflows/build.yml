name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Check files
      run: |
        pwd
        ls -la
        test -f gradlew && echo "gradlew exists" || echo "gradlew NOT found"
        test -f src/android/app/build.gradle.kts && echo "build.gradle.kts exists" || echo "build.gradle.kts NOT found"
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Create Gradle wrapper
      run: |
        if [ ! -f gradlew ]; then
          echo "Creating gradlew..."
          curl -sL https://raw.githubusercontent.com/gradle/gradle/master/gradlew -o gradlew
          chmod +x gradlew
        fi
        ls -la gradlew
    
    - name: Build Debug APK
      run: |
        echo "Building APK..."
        ./gradlew assembleDebug || {
          echo "Build failed, trying alternative..."
          # Try without submodule
          ./gradlew :src:android:app:assembleDebug
        }
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: src/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
