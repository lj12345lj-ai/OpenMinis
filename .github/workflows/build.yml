name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Check files
      run: |
        pwd
        ls -la
        ls -la src/android/app/ 2>/dev/null | head -20
        test -f gradlew && echo "gradlew exists" || echo "gradlew NOT found"
    
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Test Gradle
      run: |
        chmod +x gradlew
        ./gradlew --version
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      continue-on-error: true
    
    - name: Check output
      run: |
        find . -name "*.apk" -type f 2>/dev/null | head -10
        ls -la src/android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK found"
